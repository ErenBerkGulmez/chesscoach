version: '3.8'

services:
  # ─── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chess-coach-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chess_coach
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ─────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chess-coach-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # ─── Bull Board (Queue Monitor) ───────────────────────────────
  # Optional: uncomment to visualize BullMQ queues
  # bull-board:
  #   image: deadly0/bull-board
  #   container_name: chess-coach-bull-board
  #   restart: unless-stopped
  #   ports:
  #     - "3002:3000"
  #   environment:
  #     REDIS_HOST: redis
  #     REDIS_PORT: 6379

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
